site_name: Proxmox Homelab
site_description: Step-by-step guides for a self-hosted Proxmox homelab - from bare metal through full service integration.
site_url: https://homelab.prsgoo.com
repo_url: https://github.com/Prsgoo/homelab
repo_name: Prsgoo/homelab
copyright: Copyright &copy; 2026 Prsgoo

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tooltips

plugins:
  - search

markdown_extensions:
  - abbr
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.snippets:
      base_path: docs
      auto_append:
        - includes/abbreviations.md
  - admonition
  - tables
  - attr_list
  - def_list
  - footnotes
  - toc:
      permalink: true

