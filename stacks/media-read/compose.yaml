networks:
  media-read:
    driver: bridge

services:
  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:latest
    container_name: suwayomi
    restart: unless-stopped
    # Image hardcodes UID 1000; override GID to 1300 (media) for write access to /manga
    user: "1000:1300"
    environment:
      - TZ=Europe/Madrid
      - DOWNLOAD_AS_CBZ=true
    volumes:
      - /manga:/manga
      - /data/suwayomi:/home/suwayomi/.local/share/Tachidesk
    ports:
      - "4567:4567"
    networks:
      - media-read
