http:
  routers:
    suwayomi-admin:
      rule: "Host(`manga-reader.home.<your-domain>`)"
      service: suwayomi
      entryPoints:
        - admin
      tls: {}
      middlewares:
        - admin-only

  services:
    suwayomi:
      loadBalancer:
        servers:
          - url: "http://<server-ip>:4567"
