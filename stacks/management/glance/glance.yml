              - links:
                  - title: Jellystat
                    url: https://jellystat.home.example.com:<admin-port>
                    icon: di:jellystat
              - links:
                  - title: Seerr
                    url: https://seerr.home.example.com
                    icon: di:seerr
              - links:
                  - title: Sonarr
                    url: https://sonarr.home.example.com:<admin-port>
                    icon: di:sonarr
              - links:
                  - title: Radarr
                    url: https://radarr.home.example.com:<admin-port>
                    icon: di:radarr
              - links:
                  - title: Prowlarr
                    url: https://prowlarr.home.example.com:<admin-port>
                    icon: di:prowlarr
              - links:
                  - title: Bazarr
                    url: https://bazarr.home.example.com:<admin-port>
                    icon: di:bazarr
              - links:
                  - title: Dispatcharr
                    url: https://dispatcharr.home.example.com:<admin-port>
