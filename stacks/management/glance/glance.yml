                    url: https://fr24.home.example.com:<admin-port>
                    icon: di:flightradar24

      - size: small
        widgets:
          - type: dns-stats
            service: pihole-v6
            url: http://<pihole-ip>
            password: ${PIHOLE_PASSWORD}
