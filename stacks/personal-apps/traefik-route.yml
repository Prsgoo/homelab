http:
  routers:
    actual-budget:
      rule: "Host(`budget.<your-domain>`)"
      service: actual-budget
      entryPoints:
        - admin
      middlewares:
        - admin-only
      tls: {}

    mealie:
      rule: "Host(`mealie.<your-domain>`)"
      service: mealie
      entryPoints:
        - admin
      middlewares:
        - admin-only
      tls: {}

    freshrss:
      rule: "Host(`freshrss.<your-domain>`)"
      service: freshrss
      entryPoints:
        - admin
      middlewares:
        - admin-only
      tls: {}

    grimmory:
      rule: "Host(`grimmory.<your-domain>`)"
      service: grimmory
      entryPoints:
        - admin
      middlewares:
        - admin-only
      tls: {}

  services:
    actual-budget:
      loadBalancer:
        servers:
          - url: "http://<personal-apps-ip>:5006"

    mealie:
      loadBalancer:
        servers:
          - url: "http://<personal-apps-ip>:9000"

    freshrss:
      loadBalancer:
        servers:
          - url: "http://<personal-apps-ip>:8080"

    grimmory:
      loadBalancer:
        servers:
          - url: "http://<personal-apps-ip>:6060"
